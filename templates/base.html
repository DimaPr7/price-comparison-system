
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kainos24 Clone{% endblock %}</title>

    <link href="googleapis.com" rel="stylesheet">
    {% block extra_head %}{% endblock %}

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --radius: 12px;
            --navbar-height: 70px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--navbar-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .navbar-container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .navbar-brand span {
            color: var(--primary);
        }

        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-greeting {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .nav-link {
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .btn-nav-login {
            color: var(--text-main);
        }

        .btn-nav-register {
            background: var(--primary);
            color: #fff !important;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .btn-nav-register:hover {
            background: var(--primary-hover);
        }

        .btn-nav-logout {
            color: #ef4444;
        }

        .btn-nav-logout:hover {
            color: #dc2626;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 0 20px;
            box-sizing: border-box;
            margin-top: calc(var(--navbar-height) + 30px);
            margin-bottom: 50px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 24px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                🛍️ Kainos24<span>Clone</span>
            </a>

            <div class="navbar-menu">
                {% if user.is_authenticated %}
                    <p class="user-greeting">Hello, <b>{{ user.username }}</b> 👋</p>
                    <a href="/logout/" class="nav-link btn-nav-logout">Logout</a>
                {% else %}
                    <a href="/accounts/login/" class="nav-link btn-nav-login">Login</a>
                    <a href="/register/" class="nav-link btn-nav-register">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
