{% extends "base.html" %}

{% block content %}

<style>

.edit-container {
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
}

.edit-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;
}

.save-btn {
    background: #60a5fa;
    color: white;

    border: none;

    padding: 12px 18px;

    border-radius: 10px;

    cursor: pointer;
}

</style>

<div class="edit-container">

    <div class="edit-card">

        <h1>Edit profile</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                {{ form.name }}
            </div>

            <div class="form-group">
                <label>Avatar</label>
                {{ form.avatar }}
            </div>

            <button
                type="submit"
                class="save-btn"
            >
                Save changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
