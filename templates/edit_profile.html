{% extends "base.html" %}

{% block content %}

<div class="edit-container">

    <div class="edit-card">

        <h1>Edit profile</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                {{ form.name }}
            </div>

            <div class="form-group">
                <label>Avatar</label>
                {{ form.avatar }}
            </div>

            <button type="submit" class="save-btn">
                Save changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
