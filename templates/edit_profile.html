{% extends "base.html" %}

{% block content %}

<div class="edit-container">

    <div class="edit-card">

        <h1>Edit profile</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Email</label>
                {{ form.email }}
            </div>

            <button type="submit" class="save-btn">
                Save changes
            </button>

        </form>

    </div>

</div>

{% endblock %}
