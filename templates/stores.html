{% extends "base.html" %}

{% block content %}

<div class="stores-container">

    <h2 class="stores-title">Stores</h2>

    <div class="stores-grid">

        {% for store in stores %}
            <a href="{{ store.website_url }}" class="store-card" target="_blank">

                {% if store.logo_url %}
                    <img src="{{ store.logo_url }}" alt="{{ store.name }}">
                {% else %}
                    <span>{{ store.name }}</span>
                {% endif %}

            </a>
        {% endfor %}

    </div>

</div>

{% endblock %}
