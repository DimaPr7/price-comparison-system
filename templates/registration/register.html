{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
    <h2 style="margin-bottom: 20px; text-align: center;">Register</h2>
    
    <form method="post" class="django-auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 10px;">Create Account</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b;">
        Already have an account? <a href="/accounts/login/" style="color: #2563eb; text-decoration: none; font-weight: 600;">Login</a>
    </p>
</div>

<style>
    .django-auth-form p {
        margin-bottom: 16px;
    }
    .django-auth-form label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: #64748b;
    }
    .django-auth-form input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 0.95rem;
    }
    .django-auth-form input:focus {
        outline: none;
        border-color: #2563eb;
    }
    .django-auth-form .errorlist {
        color: #ef4444;
        padding-left: 20px;
        font-size: 0.85rem;
        margin-bottom: 10px;
    }
    .django-auth-form .helptext {
        display: block;
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 4px;
    }
</style>
{% endblock %}
